name: Feature request
description: Suggest a capability or an agent adapter.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that is hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The smallest change that would solve it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: input
    id: agent
    attributes:
      label: Agent or tool
      description: Claude Code, Codex, OpenCode, Cursor, custom harness, etc.
